[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thymus-quant"
version = "0.1.0"
description = "TRQ->ETV quantification and QC for chest CT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
]

[project.scripts]
thymus-quant = "thymus_quant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
