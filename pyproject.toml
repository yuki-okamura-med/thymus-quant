[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thymus-quant"
version = "0.1.0a4"
description = "Thymic quantification toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "Yuki Okamura"},
]
keywords = ["thymus", "CT", "segmentation", "quantification", "medical-imaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "huggingface_hub>=0.23",
  "monai>=1.3",
  "numpy>=1.24",
  "nibabel>=5.0",
  "pandas>=2.0",
  "safetensors>=0.4",
  "SimpleITK>=2.3",
  "scipy>=1.10",
  "torch>=2.0",
  "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/yuki-okamura-med/thymus-quant"
Issues = "https://github.com/yuki-okamura-med/thymus-quant/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests requiring real model weights, network, or GPU",
]
