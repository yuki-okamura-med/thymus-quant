[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thymus-quant"
version = "0.1.0a0"
description = "Thymic quantification toolkit (Okamura / Chaunzwa)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
]

[tool.setuptools]
packages = ["thymus_quant"]
